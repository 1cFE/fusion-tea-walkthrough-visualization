# .github/workflows/sync_data.yml
# Triggers: any push to 1cFE/fusion-tea that touches model_output.txt
# (via repository_dispatch from a companion action in the fusion-tea repo)
# OR manually via workflow_dispatch.
#
# On trigger:
#   1. Fetches the latest model_output.txt from the fusion-tea repo (public, no auth needed)
#   2. Runs parse_model_output.py to produce data.json
#   3. Commits and pushes data.json back to this repo
#   4. GitHub Pages serves the updated data.json automatically

name: Sync model data

on:
  # Manual trigger from the GitHub UI
  workflow_dispatch:

  # Triggered by a companion workflow in fusion-tea repo
  repository_dispatch:
    types: [model_output_updated]

  # Also poll every 6 hours as a fallback
  schedule:
    - cron: '0 */6 * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout visualization repo
        uses: actions/checkout@v4

      - name: Fetch latest model_output.txt from fusion-tea
        run: |
          curl -fsSL \
            "https://raw.githubusercontent.com/1cFE/fusion-tea/main/exploration/concept_analysis/analyses/21-spherical-tokamak-hts/model_output.txt" \
            -o model_output.txt
          echo "Fetched model_output.txt"
          head -4 model_output.txt

      - name: Parse into data.json
        run: python parse_model_output.py model_output.txt data.json

      - name: Commit data.json if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          # Only commit if data.json actually changed
          if git diff --cached --quiet; then
            echo "data.json unchanged - no commit needed"
          else
            LCOE=$(python -c "import json; d=json.load(open('data.json')); print(d['lcoe_1gw'])")
            git commit -m "Auto-update: LCOE=${LCOE} \$/MWh [$(date -u +%Y-%m-%dT%H:%M)]"
            git push
            echo "Pushed updated data.json"
          fi
